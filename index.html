<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to My Site</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Home Page</h2>
            <p>This is a simple website created as an example.</p>
            <button id="clickMe">Click me</button>
        </section>

        <section class="calculator">
            <h2>Staking Profit Calculator</h2>
            <input type="number" id="amount" placeholder="Amount" min="0">
            <input type="number" id="rate" placeholder="Annual % Rate" min="0" step="0.1">
            <input type="number" id="months" placeholder="Months" min="1">
            <button id="calcBtn">Calculate</button>
            <div id="result" class="result"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
